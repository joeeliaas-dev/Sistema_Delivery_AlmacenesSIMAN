name: CI Trazza

# Revisa la app real (Expo, la que se publica en trazzasv) en cada push y pull request a main:
# que no se suban claves, lint, pruebas unitarias y que la versión web compile.
# No publica: la publicación se hace a mano con `npm run release:cloud` (proyecto-mad-9bdd2).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revisar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revisar:
    name: Revisar la app
    runs-on: ubuntu-24.04
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Comprobar que no se suben claves ni configuración local
        run: |
          prohibidos=$(git ls-files | grep -E '(^|/)\.env($|\.local$|\..*\.local$)|^scripts/cloud/cloudConfig\.json$' || true)
          if [ -n "$prohibidos" ]; then
            echo "::error::Estos archivos no deben estar en el repositorio:"
            echo "$prohibidos"
            exit 1
          fi
          echo "OK: sin claves en el repositorio"

      - name: Revisar los archivos JSON
        run: |
          for archivo in .firebaserc firebase.cloud.json firebase.cloud-seed.json firestore.indexes.json app.json src/config/*.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$archivo"
            echo "OK $archivo"
          done

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias
        run: npm run pruebas -- unidad

      - name: Compilar la versión web
        env:
          EXPO_PUBLIC_USE_EMULATORS: 'false'
        run: npx expo export --platform web --output-dir dist-ci
